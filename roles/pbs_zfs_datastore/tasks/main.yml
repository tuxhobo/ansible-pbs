#./roles/pbs_zfs_datastore/tasks/main.yml
#
---
# 1. Idempotent ZFS Pool Creation
- name: Create ZFS pool
  community.general.zpool:
    name: "{{ pbs_datastore.pool }}"
    vdevs:
      - type: stripe
        disks: "{{ zfs_pool.device }}"
    pool_properties:
      ashift: "{{ zfs_pool.ashift }}"
      # autotrim: "{{ zfs_pool.autotrim }}"  # not supported by Ansible module, set via command below
    filesystem_properties:
      compression: "{{ zfs_pool.compression }}"
    state: present

- name: Set autotrim on ZFS pool
  command: zpool set autotrim={{ zfs_pool.autotrim }} {{ pbs_datastore.pool }}
  changed_when: false
  when: zfs_pool.autotrim | bool

# 2. Idempotent PBS Registration
- name: Get current PBS datastore registry
  command: proxmox-backup-manager datastore list --output-format json
  register: pbs_ds_list
  changed_when: false
  failed_when:
    - pbs_ds_create.rc is defined
    - pbs_ds_create.rc != 0

- name: Register PBS datastore
  command: >
    proxmox-backup-manager datastore create
    {{ pbs_datastore.name }}
    {{ pbs_datastore.path }}
  when:
    - pbs_ds_list.rc == 0
    - pbs_datastore.name not in (pbs_ds_list.stdout | from_json | map(attribute='name') | list)
  changed_when: true
  register: pbs_ds_create

- name: Datastore status
  debug:
    msg: >-
      {{ 'Datastore ' + pbs_datastore.name + ' created.'
         if (pbs_ds_create is defined and pbs_ds_create is changed)
         else 'Datastore ' + pbs_datastore.name + ' already exists, skipping create.' }}    
