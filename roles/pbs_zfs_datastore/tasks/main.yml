#./roles/pbs_zfs_datastore/tasks/main.yml
#
---
# Normalize inventory values into role-local variables
- name: Normalize datastore variables from inventory
  set_fact:
    ds_pool: "{{ pbs_datastore.pool | default(pbs_datastore_pool | default(pbs_datastore_name)) }}"
    ds_name: "{{ pbs_datastore.name | default(pbs_datastore_name | default(ds_pool)) }}"
    ds_path: "{{ pbs_datastore.path | default(pbs_datastore_path | default(pbs_datastore_mount | default('/var/lib/proxmox-backup'))) }}"
    zfs_devices: "{{ zfs_pool.devices | default(zfs_pool.device | default(zfs_pool_disks | default([]))) }}"
    zfs_autotrim: "{{ zfs_pool.autotrim | default(false) | bool }}"
    zfs_autotrim_flag: "{{ 'on' if zfs_pool.autotrim else 'off' }}"
    zfs_ashift: "{{ (zfs_pool.ashift | default(12)) | int }}"

# 1. Idempotent ZFS Pool Creation
- name: Ensure ZFS devices are defined
  assert:
    that:
      - zfs_devices | length > 0
    fail_msg: "No ZFS devices provided for pool {{ ds_pool }}; set zfs_pool.devices in inventory."
    success_msg: "ZFS devices defined: {{ zfs_devices }}"

- name: Create ZFS pool
  community.general.zpool:
    name: "{{ ds_pool }}"
    vdevs:
      - type: stripe
        disks: "{{ zfs_devices }}"
    pool_properties:
      ashift: "{{ zfs_ashift }}"
      # autotrim: "{{ zfs_autotrim_flag }}"  # not supported by Ansible module, set via command below
    filesystem_properties:
      compression: "on"
    state: present

- name: Set autotrim on ZFS pool
  command: zpool set autotrim={{ zfs_autotrim_flag }} {{ ds_pool }}
  changed_when: false
  when: zfs_autotrim | bool

# 2. Idempotent PBS Registration
- name: Get current PBS datastore registry
  command: proxmox-backup-manager datastore list --output-format json
  register: pbs_ds_list
  changed_when: false
  failed_when: false

- name: Register PBS datastore
  command: >
    proxmox-backup-manager datastore create
    {{ ds_name }}
    {{ ds_path }}
  when:
    - pbs_ds_list.rc == 0
    - ds_name not in (pbs_ds_list.stdout | from_json | map(attribute='name') | list)
  changed_when: true
  register: pbs_ds_create

- name: Datastore status
  debug:
    msg: "{{ 'Datastore ' + ds_name + ' created.' if pbs_ds_create is changed else 'Datastore ' + ds_name + ' already exists, skipping create.' }}"
    
