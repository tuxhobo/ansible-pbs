# ./roles/pve-vm-create/tasks/asserts.yml
---
- name: Assert vm_spec top-level structure
  ansible.builtin.assert:
    that:
    - vm_spec is defined
    - vm_spec.id is defined
    - vm_spec.name is defined
    - vm_spec.node is defined
    - vm_spec.memory is defined
    - vm_spec.cores is defined
    - vm_spec.disks is iterable
    - vm_spec.disks | length > 0
    - vm_spec.networks is iterable
    - vm_spec.networks | length > 0
    fail_msg: "vm_spec top-level schema violation"

- name: Assert disk schema
  ansible.builtin.assert:
    that:
    - item.bus is defined
    - item.bus == 'scsi'
    - item.storage is defined
    - item.size is defined
    - item.options is defined
    - item.options.backup is defined
    fail_msg: "Disk schema violation (see vm_spec.schema.yml)"
  loop: "{{ vm_spec.disks }}"
  loop_control:
    label: "{{ item.storage }} {{ item.size }}"

- name: Assert network schema
  ansible.builtin.assert:
    that:
    - item.bridge is defined
    fail_msg: "Network schema violation (see vm_spec.schema.yml)"
  loop: "{{ vm_spec.networks }}"
  loop_control:
    label: "{{ item.bridge }}"

- name: Assert vm options schema (if present)
  ansible.builtin.assert:
    that:
    - vm_spec.options is mapping
    fail_msg: "vm_spec.options must be a mapping"
  when: vm_spec.options is defined

- name: Assert that disks and networks are defined
  ansible.builtin.assert:
    that:
    - vm_spec.disks is defined
    - vm_spec.networks is defined
    fail_msg: "vm_disks and vm_nets must be defined before creating VM"
