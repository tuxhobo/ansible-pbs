# ./roles/pve-vm-create/tasks/render_networks.yml
---
- name: Assert network inventory is valid
  assert:
    that:
    - vm_spec.networks is defined
    - vm_spec.networks | length > 0
    - vm_spec.networks | map(attribute='id') | list | length == vm_spec.networks | length
    fail_msg: "vm_spec.networks is missing or malformed"

- name: Render net map for proxmox_kvm
  set_fact:
    vm_net: >-
      {{
        vm_net | default({}) |
        combine({
          item.key: (
            item.value.model
            ~ ',bridge=' ~ item.value.bridge
            ~ (',firewall=' ~ item.value.firewall if item.value.firewall is defined else '')
          )
        })
      }}
  loop: "{{ vm_spec.networks | dict2items }}"

- name: Debug rendered net map
  debug:
    var: vm_net
  when: ansible_verbosity | int >= 2
