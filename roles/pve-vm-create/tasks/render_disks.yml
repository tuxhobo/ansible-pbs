# ./roles/pve-vm-create/tasks/render_disks.yml
---
- name: Initialize disk map
  ansible.builtin.set_fact:
    vm_disks: {}

- name: Render Proxmox disk entries
  ansible.builtin.set_fact:
    vm_disks: >-
      {{
        vm_disks | combine({
          (item.bus ~ idx): {
            'storage': item.storage,
            'size': item.size,
            'backup': item.options.backup | bool,
            'discard': item.options.discard
                       | default(vm_defaults.disk.discard),
            'iothread': item.options.iothread
                         | default(vm_defaults.disk.iothread)
                         | bool,
            'replicate': item.options.replicate
                          | default(vm_defaults.disk.replicate)
                          | bool
          }
        })
      }}
  loop: "{{ vm_spec.disks }}"
  loop_control:
    index_var: idx
    label: "{{ item.storage }} {{ item.size }}"
