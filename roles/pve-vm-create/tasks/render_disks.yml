# ./roles/pve-vm-create/tasks/render_disks.yml
---
- name: Assert disk inventory is valid
  assert:
    that:
    - vm_spec.disks is defined
    - vm_spec.disks | length > 0
    - vm_spec.disks | map(attribute='id') | list | length == vm_spec.disks | length
    fail_msg: "vm_spec.disks is missing or malformed"

- name: Render scsi disk map for proxmox_kvm
  set_fact:
    vm_scsi: >-
      {{
        vm_scsi | default({}) |
        combine({
          item.key: (
            item.value.storage ~ ':' ~ item.value.size
            ~ (',iothread=' ~ item.value.iothread if item.value.iothread is defined else '')
            ~ (',discard=' ~ item.value.discard if item.value.discard is defined else '')
          )
        })
      }}
  loop: "{{ vm_spec.disks | dict2items }}"

- name: Debug rendered scsi map
  debug:
    var: vm_scsi
  when: ansible_verbosity | int >= 2
