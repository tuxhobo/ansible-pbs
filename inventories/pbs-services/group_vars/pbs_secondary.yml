# ./inventories/pbs-services/group-vars/pbs_secondary.yml
#
# Configuration of the datastore

pbs_role: secondary

pbs_datastore:
  name: secondary-backups
  path: /mnt/datastore/dfw

pbs_users:
- name: sync
  role: RemoteSyncOperator

pbs_sync:
  enabled: true
  direction: pull
  schedule: "02:00"
  remote:
    id: pbsfront
    host: 172.16.100.5
    port: 8007 # Explicit statement of default port
    datastore: lalaland-backups
