# ./inventories/pbs-bootstrap/host_vars/pbsback.yml
#
# Configuration values unique to each PBS instance
hostname: pbsback
fqdn: pbsback.lalalandus.com

replication:
  interface: ens19
  address: 172.16.150.5/28
  gateway: 172.16.150.1
  remote_subnet: 172.16.100.0/28

zfs_pool:
  name: dfw_pool
  device: /dev/sdb

# Configuration of the datastore
pbs_datastore:
  name: secondary-backups
  pool: dfw_pool
  path: /mnt/datastore/dfw

pbs_users:
- name: sync
  role: RemoteSyncOperator

gotify:
  app_name: Proxmox Backup Server Back

pbs_sync:
  enabled: true
  direction: pull
  schedule: "02:00"
  remote:
    id: pbsfront
    host: 172.16.100.5
    port: 8007 # Explicit statement of default port
    datastore: lalaland-backups
